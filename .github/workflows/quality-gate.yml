name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: detect-artifact-changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      container: ${{ steps.filter.outputs.container }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "container=true" >> "$GITHUB_OUTPUT"
            echo "tooling=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > changed-files.txt
          if grep -Eq '^(src/|frontend/|api/|build\.gradle\.kts$|gradle/|gradle\.properties$|gradle\.lockfile$|Dockerfile$|\.dockerignore$|security/|\.github/workflows/)' changed-files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "container=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "container=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(build\.gradle\.kts$|gradle/|gradle\.properties$|gradle\.lockfile$|frontend/(eslint\.config\.js|package(-lock)?\.json)$|\.gitleaks\.toml$|src/quality-fixtures/|\.github/workflows/)' changed-files.txt; then
            echo "tooling=true" >> "$GITHUB_OUTPUT"
          else
            echo "tooling=false" >> "$GITHUB_OUTPUT"
          fi

  validation-scope:
    name: validation-scope-shadow
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Classify pull request in shadow mode
        if: github.event_name == 'pull_request'
        run: node scripts/classify-validation-scope.mjs --base "origin/${{ github.base_ref }}"
      - name: Classify complete inventory outside pull requests
        if: github.event_name != 'pull_request'
        run: node scripts/classify-validation-scope.mjs --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-plan
          path: build/reports/validation/plan.json
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Sin cambios de código: quality-gate no necesita ejecución."
        if: needs.changes.outputs.code != 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        if: needs.changes.outputs.code == 'true'
      - run: npm ci --prefix frontend
        if: needs.changes.outputs.code == 'true'
      - run: npm --prefix frontend run playwright:install -- --with-deps
        if: needs.changes.outputs.code == 'true'
      - run: ./gradlew fastGate --no-daemon
        if: needs.changes.outputs.code == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: quality-reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: warn

  tooling-gate:
    name: tooling-gate
    if: github.event_name != 'pull_request' || needs.changes.outputs.tooling == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: npm ci --prefix frontend
      - run: ./gradlew toolingGate --no-daemon

  container-security:
    name: container-security
    if: github.event_name != 'pull_request' || needs.changes.outputs.container == 'true'
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: npm ci --prefix frontend
      - run: ./gradlew trivy --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: supply-chain-reports
          path: build/reports/security/**
          if-no-files-found: warn

  reproducibility:
    name: oci-reproducibility
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [quality-gate, container-security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: npm ci --prefix frontend
      - run: ./gradlew verifyOciReproducibility --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reproducibility-reports
          path: build/reports/security/oci-reproducibility.txt
          if-no-files-found: warn

  publish-ghcr:
    name: publish-ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, container-security, reproducibility]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run playwright:install -- --with-deps
      - run: ./gradlew publishOciImage --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-metadata-${{ github.sha }}
          path: build/reports/security/image-metadata.json
          if-no-files-found: error
