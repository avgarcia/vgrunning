name: codeql-javascript-typescript

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/openapi/**'
      - 'scripts/**'
      - '.github/workflows/codeql-javascript-typescript.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/openapi/**'
      - 'scripts/**'
      - '.github/workflows/codeql-javascript-typescript.yml'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-javascript-typescript:
    name: codeql-javascript-typescript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd
