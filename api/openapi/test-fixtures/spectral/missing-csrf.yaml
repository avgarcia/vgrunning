openapi: 3.1.1
info: { title: Invalid, version: 0.0.1 }
servers: [{ url: /api }]
security: [{ opaqueSession: [] }]
components:
  securitySchemes:
    opaqueSession: { type: apiKey, in: cookie, name: SESSION }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-TOKEN }
paths:
  /plans/{planId}:
    delete:
      operationId: deletePlan
      parameters:
        - { in: path, name: planId, required: true, schema: { type: string } }
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
