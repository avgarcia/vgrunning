spring:
  application:
    name: running-coach
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${RUNNING_COACH_DB_URL:jdbc:postgresql://localhost:5432/running_coach}
    username: ${RUNNING_COACH_DB_USERNAME:running_coach}
    password: ${RUNNING_COACH_DB_PASSWORD:running_coach}
    hikari:
      pool-name: running-coach
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: platform
    schemas:
      - platform
    create-schemas: true
    clean-disabled: true
  jooq:
    sql-dialect: postgres
  modulith:
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

logging:
  structured:
    format:
      console: logstash

server:
  shutdown: graceful

pmv:
  identity:
    rate-limit-hmac-key: ${PMV_IDENTITY_RATE_LIMIT_HMAC_KEY}
    security-event-retention: ${PMV_IDENTITY_SECURITY_EVENT_RETENTION}
    synthetic:
      administrator-password: ${PMV_IDENTITY_SYNTHETIC_ADMINISTRATOR_PASSWORD:}
      runner-password: ${PMV_IDENTITY_SYNTHETIC_RUNNER_PASSWORD:}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
